<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>Prompts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23111'/%3E%3Crect x='4' y='4' width='8' height='8' rx='1' fill='none' stroke='%23fff' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#fff;--ink:#111;--mute:#737373;--line:#e6e6e6;--soft:#f4f4f4;--inv:#fff;
  --sans:"Pretendard Variable",Pretendard,system-ui,-apple-system,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0d;--ink:#f1f1f1;--mute:#8e8e8e;--line:#262626;--soft:#181818;--inv:#0d0d0d}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}

/* 헤더 */
.top{max-width:1320px;margin:0 auto;padding:56px max(4vw,16px) 28px;display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:clamp(26px,3.4vw,34px);font-weight:700;letter-spacing:-.025em;line-height:1.15}
.desc{margin:8px 0 0;color:var(--mute);font-size:15px;white-space:pre-line;max-width:60ch}

/* 버튼 */
.btn{height:40px;padding:0 16px;border:1px solid var(--ink);background:transparent;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap}
.btn.fill{background:var(--ink);color:var(--inv)}
.btn.line{border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.wide{width:100%;height:48px;font-size:15px}

/* 갤러리 */
main{max-width:1320px;margin:0 auto;padding:0 max(4vw,16px) 80px}
.cats{display:flex;gap:26px;border-block:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:28px}
.cats::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;flex:none;padding:15px 0 13px;font-size:15px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tab:focus-visible{outline:2px solid var(--ink)}
.tab small{margin-left:5px;font-size:12px;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:32px 18px}
.grid.ruled{border-top:1px solid var(--line);padding-top:28px}
.card{all:unset;cursor:pointer;display:block}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.ph{aspect-ratio:1/1;background:var(--soft);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block;opacity:0;transition:transform .5s ease,opacity .35s}
.ph img.ld{opacity:1}
.card:hover .ph img{transform:scale(1.035)}
.noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:12px;letter-spacing:.08em}
.nm{margin-top:10px;font-size:15px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:80px 0;text-align:center;color:var(--mute)}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}.top{padding-top:36px}}

/* 다이얼로그 공통 */
dialog{border:0;padding:0;background:var(--bg);color:var(--ink);max-width:none;max-height:none}
dialog::backdrop{background:rgba(0,0,0,.72)}
.x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;font-size:22px;line-height:1;z-index:2}

/* 보기 창 — 크기는 layoutView()가 사진 비율에 맞춰 정함 */
#view{width:min(920px,94vw);height:min(620px,90vh)}
.vw{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);height:100%}
.vimg{background:var(--soft);display:grid;place-items:center;overflow:hidden;touch-action:pan-y}
.vimg img{width:100%;height:100%;object-fit:contain}
.vb{padding:40px 32px 32px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.vcat{margin:0;font-size:13px;color:var(--mute)}
.vb h2{margin:0;padding-right:44px;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.vb h2:focus{outline:none}
.vdesc{margin:0;color:var(--mute);font-size:14.5px;line-height:1.7;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
.vdesc a{color:inherit;text-underline-offset:3px}
.copies{display:grid;margin-top:auto;padding-top:24px}
.crow{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:0 4px;border-top:1px solid var(--line);cursor:pointer;font-size:15px;font-weight:500}
.crow:last-child{border-bottom:1px solid var(--line)}
.crow:hover{background:var(--soft)}
.crow:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.ck{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);flex:none;font-weight:500}
.ck svg{width:15px;height:15px}
.crow:hover .ck,.crow.done .ck{color:var(--ink)}
.crow.done .ck{font-weight:600}
#view.land{width:min(880px,94vw);height:fit-content;max-height:92vh}
#view.land .vw{grid-template-columns:1fr;height:auto;max-height:92vh;overflow:auto}
#view.land .vimg{aspect-ratio:var(--r)}
#view.land .vb{overflow:visible}
#view.land .copies{margin-top:0}
@media(max-width:760px){
  #view{width:100vw;height:100dvh}
  .vw{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}
  .vimg{height:auto;aspect-ratio:var(--r,1);max-height:64vh}
  .vb{overflow:visible;padding:24px 18px 32px}
  .copies{margin-top:6px}
}

/* 입력칸·안내 문구 (잠금 화면과 관리자 화면 공용) */
input[type=text],input[type=password],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);padding:11px 12px;font-size:16px;border-radius:0}
input:focus,textarea:focus,select:focus{border-color:var(--ink);outline:none}
.hint{margin:0;font-size:13px;color:var(--mute)}
.msg{margin:0;font-size:14px;min-height:1.2em}

/* 사이트 잠금 화면 — 잠겨 있는 동안 본문은 아예 그리지 않음 */
body.locked>header,body.locked>main{display:none}
#lock{position:fixed;inset:0;background:var(--bg);z-index:25;display:grid;place-items:center;padding:20px}
.lbox{width:min(340px,100%);display:grid;gap:14px;text-align:center}
.lbox svg{width:28px;height:28px;justify-self:center;color:var(--ink)}
.lbox h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
.lbox input{text-align:center;font-size:20px;letter-spacing:.3em;padding:12px}
.lbox input::placeholder{letter-spacing:normal;font-size:15px}
.lbox .hint{line-height:1.6;white-space:pre-line}
.lbox .notice{margin:0;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px;white-space:pre-line;line-height:1.6}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,150%);background:var(--ink);color:var(--inv);padding:11px 18px;border-radius:999px;font-size:14px;transition:transform .2s,opacity .2s;z-index:30;max-width:92vw;opacity:0;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="locked">

<header class="top">
  <div>
    <h1 id="siteTitle">Prompts</h1>
    <p class="desc" id="siteDesc" hidden></p>
  </div>
</header>

<main>
  <nav class="cats" id="cats" aria-label="카테고리" hidden></nav>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden></p>
</main>

<!-- 보기 창 -->
<dialog id="view" aria-labelledby="vName">
  <button class="x" data-close aria-label="닫기">×</button>
  <div class="vw">
    <div class="vimg" id="vImg"></div>
    <div class="vb">
      <p class="vcat" id="vCat"></p>
      <h2 id="vName" tabindex="-1" autofocus></h2>
      <div class="vdesc" id="vDesc"></div>
      <div class="copies" id="vCopies"></div>
    </div>
  </div>
</dialog>

<!-- 사이트 잠금 -->
<section id="lock" hidden>
  <form class="lbox" id="lockForm" novalidate>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
    <h2>비밀번호를 입력해 주세요</h2>
    <input type="password" id="lockPw" autocomplete="current-password" aria-label="비밀번호" placeholder="비밀번호">
    <button class="btn fill wide" id="lockBtn">열기</button>
    <p class="msg" id="lockMsg" role="status"></p>
    <p class="hint" id="lockHint" hidden></p>
    <p class="notice" id="lockNotice" hidden></p>
  </form>
</section>

<div id="toast" role="status" aria-live="polite"></div>

<script>
{
/* ================= 기본 도구 ================= */
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const str=v=>typeof v==='string'?v:'';
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=32768)s+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const VERSION='1',MOBILE=760,DEFAULT_TITLE='Prompts';

const S={
  site:{title:'',description:'',categories:[],items:[]},
  cat:'',            // 선택한 탭
  loadError:false,
  admin:null,        // 관리자 로그인 정보 (admin.js가 채움, 메모리에만)
  local:{},          // 방금 올린 이미지 미리보기 (경로 → blob URL)
  viewing:null,vr:1, // 보기 창 항목, 사진 비율
  work:null          // 순서 바꾸기 중인 목록 (admin.js가 채움)
};

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}

/* 데이터에서 온 이미지 경로는 저장소 안 폴더나 https만 허용 */
const safeSrc=p=>{p=str(p);return /^(images|thumbs)\/[\w.-]+$/.test(p)||/^https:\/\//.test(p)?p:''};
const isRepoFile=p=>/^(images|thumbs)\/[\w.-]+$/.test(str(p));

const SVG={copy:'<rect x="5.5" y="5.5" width="8" height="8" rx="1"/><path d="M10.5 3.5v-.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h.5"/>',check:'<path d="M3 8.5l3.2 3L13 4.5"/>'};
function icon(name){
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  for(const[k,v]of Object.entries({viewBox:'0 0 16 16',fill:'none',stroke:'currentColor','stroke-width':'1.4','stroke-linecap':'round','stroke-linejoin':'round','aria-hidden':'true'}))s.setAttribute(k,v);
  s.innerHTML=SVG[name];return s;
}
function linkify(box,text){
  box.replaceChildren();
  for(const part of text.split(/(https:\/\/[^\s<>"']+)/)){
    if(/^https:\/\//.test(part)){const a=el('a',null,part);a.href=part;a.target='_blank';a.rel='noopener noreferrer';box.append(a)}
    else if(part)box.append(document.createTextNode(part));
  }
}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);return true}catch(_){}
  const ta=el('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;opacity:0';
  document.body.append(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok;
}

/* ================= 사이트 잠금 =================
  lock.json        : 비밀번호로 감싼 내용 키 (+ 힌트·안내 문구)
  prompts.enc.json : 내용 키로 암호화한 목록
  images/*.bin     : 내용 키로 암호화한 이미지 ([iv 12바이트][암호문])
  비밀번호 없이는 목록·이미지를 풀 수 없음. 해제한 키는 이 탭에서만 기억(sessionStorage). */
const LOCK={on:false,meta:null,key:null,raw:null};
const LOCK_ITER=600000,SKEY='prompts-unlock';
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const importKey=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function encBytes(u8){const iv=rnd(12),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},LOCK.key,u8));const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return o}
async function decBytes(u8){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8.subarray(0,12)},LOCK.key,u8.subarray(12)))}
async function encJson(obj){const iv=rnd(12),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},LOCK.key,enc.encode(JSON.stringify(obj))));return JSON.stringify({v:1,iv:b64(iv),data:b64(ct)})+'\n'}
async function decJson(text){const o=JSON.parse(text);return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},LOCK.key,unb64(o.data))))}
async function unlockWith(pw){
  const w=LOCK.meta.wrap,kek=await keyFrom(pw,unb64(w.salt),Number(w.iter)||LOCK_ITER);
  const raw=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(w.iv)},kek,unb64(w.data)));
  await setKey(raw);
}
async function setKey(raw){LOCK.raw=raw;LOCK.key=await importKey(raw);try{sessionStorage.setItem(SKEY,b64(raw))}catch(_){}}
function forgetKey(){LOCK.key=LOCK.raw=null;try{sessionStorage.removeItem(SKEY)}catch(_){}}
const sniff=u=>u[0]===0xFF&&u[1]===0xD8?'image/jpeg':u[0]===0x89&&u[1]===0x50?'image/png':'image/webp';
/* 경로 → 화면에 쓸 주소. .bin이면 받아서 복호화한 blob 주소 */
const imgCache=new Map();
function imgURL(p){
  p=str(p);
  if(S.local[p])return Promise.resolve(S.local[p]);
  if(/\.bin$/.test(p)&&isRepoFile(p)){
    if(!LOCK.key)return Promise.reject();
    if(!imgCache.has(p))imgCache.set(p,(async()=>{
      const r=await fetch(p);if(!r.ok)throw 0;
      const u=await decBytes(new Uint8Array(await r.arrayBuffer()));
      return URL.createObjectURL(new Blob([u],{type:sniff(u)}));
    })().catch(e=>{imgCache.delete(p);throw e}));
    return imgCache.get(p);
  }
  const u=safeSrc(p);return u?Promise.resolve(u):Promise.reject();
}
function showLock(){
  document.body.classList.add('locked');$('#lock').hidden=false;
  const m=LOCK.meta,h=str(m.hint).trim(),n=str(m.notice).trim();
  $('#lockHint').textContent=h;$('#lockHint').hidden=!h;
  $('#lockNotice').textContent=n;$('#lockNotice').hidden=!n;
  $('#lockMsg').textContent='';$('#lockPw').value='';$('#lockPw').focus();
}
$('#lockForm').addEventListener('submit',async e=>{
  e.preventDefault();const pw=$('#lockPw').value,b=$('#lockBtn'),m=$('#lockMsg');
  if(!pw)return;b.disabled=true;m.textContent='여는 중…';
  try{await unlockWith(pw)}catch(_){m.textContent='비밀번호가 맞지 않아요.';$('#lockPw').select();b.disabled=false;return}
  try{await loadLocked()}catch(_){forgetKey();m.textContent='목록을 열지 못했어요. 잠시 뒤 다시 시도해 주세요.';b.disabled=false;return}
  b.disabled=false;$('#lock').hidden=true;document.body.classList.remove('locked');render();route();
});
async function loadLocked(){
  const r=await fetch('prompts.enc.json?v='+Date.now(),{cache:'no-store'});
  if(r.status===404){   // 아직 암호화 전(관리자가 처음 들어오면 자동 변환)
    const o=await fetch('prompts.json?v='+Date.now(),{cache:'no-store'}).catch(()=>null);
    S.site=normalize(o?.ok?await o.json():null);S.loadError=false;return;
  }
  if(!r.ok)throw 0;
  S.site=normalize(await decJson(await r.text()));S.loadError=false;
}

/* ================= 데이터 ================= */
function normalize(d){
  d=d&&typeof d==='object'?d:{};
  const seen=new Set();
  const items=(Array.isArray(d.items)?d.items:[]).filter(x=>x&&typeof x==='object'&&typeof x.id==='string'&&!seen.has(x.id)&&seen.add(x.id));
  const categories=[...new Set((Array.isArray(d.categories)?d.categories:[]).filter(c=>typeof c==='string').map(c=>c.trim()).filter(Boolean))];
  return{title:str(d.title),description:str(d.description),categories,items};
}
/* 열 수 있으면 true, 비밀번호가 필요하면 false */
async function loadSite(){
  try{const r=await fetch('lock.json?v='+Date.now(),{cache:'no-store'});LOCK.meta=r.ok?await r.json():null}catch(_){LOCK.meta=null}
  LOCK.on=!!LOCK.meta?.wrap;
  if(LOCK.on){
    let saved=null;try{saved=sessionStorage.getItem(SKEY)}catch(_){}
    if(!saved)return false;
    try{await setKey(unb64(saved));await loadLocked();return true}catch(_){forgetKey();return false}
  }
  try{const r=await fetch('prompts.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;S.site=normalize(await r.json());S.loadError=false}
  catch(_){S.site=normalize(null);S.loadError=true}
  return true;
}
const catOf=it=>str(it.category).trim()||'기타';
function catList(){
  const s=S.site,used=[...new Set(s.items.map(it=>str(it.category).trim()).filter(Boolean))];
  const out=s.categories.concat(used.filter(c=>!s.categories.includes(c)));
  if(out.length&&s.items.some(it=>!str(it.category).trim())&&!out.includes('기타'))out.push('기타');
  return out;
}
/* 예전 형식(prompt/chars/uc)도 버튼 목록으로 */
function buttonsOf(it){
  if(Array.isArray(it.buttons))return it.buttons.filter(b=>b&&typeof b.text==='string'&&b.text.trim()).map(b=>({label:str(b.label).trim()||'내용',text:b.text,kind:str(b.kind)||'custom'}));
  const out=[],ch=(Array.isArray(it.chars)?it.chars:[]).filter(c=>typeof c==='string'&&c.trim());
  if(str(it.prompt).trim())out.push({label:'프롬프트',text:it.prompt,kind:'prompt'});
  ch.forEach((c,i)=>out.push({label:ch.length>1?`캐릭터 ${i+1}`:'캐릭터',text:c,kind:'char'}));
  if(str(it.uc).trim())out.push({label:'네거티브',text:it.uc,kind:'neg'});
  return out;
}
const visibleItems=()=>S.site.items.filter(it=>!S.cat||catOf(it)===S.cat);

/* ================= 갤러리 ================= */
/* 썸네일은 화면 근처에 왔을 때 불러옴 (잠금 사이트면 그때 복호화) */
const io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){io.unobserve(e.target);fillThumb(e.target)}},{rootMargin:'600px 0px'});
function fillThumb(ph){
  const noimg=()=>ph.replaceChildren(el('span','noimg','NO IMAGE'));
  imgURL(ph.dataset.src).then(u=>{
    const im=el('img');im.alt='';im.decoding='async';im.draggable=false;
    im.onload=()=>im.classList.add('ld');im.onerror=noimg;im.src=u;ph.replaceChildren(im);
  },noimg);
}
function card(it){
  const b=el('button','card');b.type='button';b.dataset.id=it.id;
  const ph=el('div','ph'),src=str(it.thumb)||str(it.image);
  if(src){ph.dataset.src=src;io.observe(ph)}else ph.append(el('span','noimg','NO IMAGE'));
  b.append(ph,el('div','nm',str(it.name)||'이름 없음'));
  return b;
}
/* 데이터가 바뀔 때만 카드를 다시 만들고, 탭 전환은 표시만 바꿈 */
function render(){
  const s=S.site,t=s.title||DEFAULT_TITLE;
  $('#siteTitle').textContent=t;document.title=t;
  $('#siteDesc').textContent=s.description;$('#siteDesc').hidden=!s.description;
  if(S.viewing)S.viewing=s.items.find(x=>x.id===S.viewing.id)||S.viewing;   // 저장 후 최신 항목으로
  $('#grid').replaceChildren(...(S.work||s.items).map(card));
  $('#grid').classList.toggle('sorting',!!S.work);
  renderTabs();hooks.render?.();
}
function renderTabs(){
  const cats=catList(),nav=$('#cats');
  if(S.cat&&!cats.includes(S.cat))S.cat='';
  nav.hidden=!cats.length;$('#grid').classList.toggle('ruled',!cats.length);
  const count=c=>S.site.items.filter(it=>catOf(it)===c).length;
  nav.replaceChildren(...(cats.length?[['전체','',S.site.items.length],...cats.map(c=>[c,c,count(c)])]:[]).map(([label,val,n])=>{
    const b=el('button','tab',label);b.type='button';b.dataset.cat=val;b.setAttribute('aria-pressed',S.cat===val);b.append(el('small',null,String(n)));return b;
  }));
  applyFilter();
}
function applyFilter(){
  let shown=0;const byId=new Map(S.site.items.map(x=>[x.id,x]));
  for(const c of $('#grid').children){const it=byId.get(c.dataset.id);const on=!!it&&(!S.cat||catOf(it)===S.cat);c.hidden=!on;if(on)shown++}
  for(const b of $('#cats').children)b.setAttribute('aria-pressed',b.dataset.cat===S.cat);
  const e=$('#empty');e.hidden=shown>0;
  e.textContent=S.loadError?'프롬프트 목록을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.'
    :S.site.items.length?'이 카테고리에는 아직 프롬프트가 없어요.'
    :S.admin?'아직 올린 프롬프트가 없어요. “+ 올리기”로 시작해 보세요.':'아직 올라온 프롬프트가 없어요.';
}
$('#cats').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){S.cat=b.dataset.cat;applyFilter()}});
$('#grid').addEventListener('click',e=>{if(S.work)return;const c=e.target.closest('.card');if(c)location.hash='p-'+c.dataset.id});

/* ================= 보기 창 ================= */
/* 세로·정사각형은 사진 왼쪽, 가로는 사진 위 — 창 크기를 사진 비율에 맞춤 */
function layoutView(){
  const v=$('#view'),vw=v.querySelector('.vw'),r=S.vr||1,mobile=innerWidth<=MOBILE,land=!mobile&&r>1.15;
  v.style.setProperty('--r',r);v.classList.toggle('land',land);
  v.style.width=v.style.height='';vw.style.gridTemplateColumns='';
  if(mobile)return;
  const maxW=Math.min(innerWidth*.94,1120),maxH=Math.min(innerHeight*.9,680);
  if(land){v.style.width=Math.round(Math.min(maxW,Math.max(560,innerHeight*.5*r)))+'px';return}
  const body=400;let H=maxH,col=H*r;
  if(col+body>maxW){col=maxW-body;H=Math.max(360,col/r)}
  v.style.width=Math.round(col+body)+'px';v.style.height=Math.round(H)+'px';
  vw.style.gridTemplateColumns=Math.round(col)+'px minmax(0,1fr)';
}
let resizeT;addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{if($('#view').open)layoutView()},80)});

function copyRow(label,text){
  const b=el('button','crow');b.type='button';
  const ck=el('span','ck');ck.append(icon('copy'),'복사');
  b.append(el('span',null,label),ck);
  b.onclick=async()=>{
    if(!await copyText(text)){toast('복사하지 못했어요. 브라우저 권한을 확인해 주세요.');return}
    ck.replaceChildren(icon('check'),'복사됨');b.classList.add('done');
    clearTimeout(b._t);b._t=setTimeout(()=>{ck.replaceChildren(icon('copy'),'복사');b.classList.remove('done')},1400);
  };
  return b;
}
function openView(id){
  const it=S.site.items.find(x=>x.id===id);if(!it){closeView();return}
  S.viewing=it;S.vr=Number(it.ratio)>0?Number(it.ratio):1;
  const vi=$('#vImg'),src=str(it.image)||str(it.thumb);vi.replaceChildren();
  if(src)imgURL(src).then(u=>{
    if(S.viewing?.id!==it.id)return;
    const im=el('img');im.alt=str(it.name);
    im.onload=()=>{if(S.viewing?.id===it.id&&im.naturalHeight){S.vr=im.naturalWidth/im.naturalHeight;layoutView()}};
    im.src=u;vi.replaceChildren(im);
  },()=>{if(S.viewing?.id===it.id)vi.replaceChildren(el('span','noimg','NO IMAGE'))});
  else vi.replaceChildren(el('span','noimg','NO IMAGE'));
  const cat=str(it.category).trim(),desc=str(it.memo).trim();
  $('#vCat').textContent=cat;$('#vCat').hidden=!cat;
  $('#vName').textContent=str(it.name)||'이름 없음';
  linkify($('#vDesc'),desc);$('#vDesc').hidden=!desc;
  $('#vCopies').replaceChildren(...buttonsOf(it).map(b=>copyRow(b.label,b.text)));
  hooks.view?.(it);
  const v=$('#view');if(!v.open)v.showModal();
  layoutView();v.querySelector('.vb').scrollTop=0;v.querySelector('.vw').scrollTop=0;
}
function closeView(){const v=$('#view');if(v.open)v.close()}
/* ←/→ 키와 사진 스와이프로 이전·다음 */
function step(d){
  const list=visibleItems(),i=list.findIndex(x=>x.id===S.viewing?.id);
  if(i<0||list.length<2)return;
  location.replace('#p-'+list[(i+d+list.length)%list.length].id);
}
document.addEventListener('keydown',e=>{if(!$('#view').open||e.target.matches?.('input,textarea,select'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
{let x0=null;const vi=$('#vImg');
  vi.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  vi.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)step(dx<0?1:-1)});}
$('#view').addEventListener('close',()=>{S.viewing=null;if(location.hash.startsWith('#p-'))history.replaceState(null,'',location.pathname+location.search)});

/* 다이얼로그: 바깥(배경)에서 눌렀다 뗐을 때만 닫기 — 글자 드래그하다 닫히는 것 방지 */
function wireDialog(d,close=()=>d.close()){
  let downOnBackdrop=false;
  d.addEventListener('pointerdown',e=>{downOnBackdrop=e.target===d});
  d.addEventListener('click',e=>{if(e.target===d&&downOnBackdrop)close()});
  d.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
}
wireDialog($('#view'));
/* ================= 라우팅 ================= */
function route(){
  if(LOCK.on&&!LOCK.key)return;   // 잠금 해제 전에는 아무것도 열지 않음
  const h=location.hash;
  if(h==='#admin'){if(S.admin)history.replaceState(null,'',location.pathname);else openAdmin();return}
  hooks.route?.();
  if(h.startsWith('#p-'))openView(decodeURIComponent(h.slice(3)));else closeView();
}
addEventListener('hashchange',route);

/* ================= 관리자 =================
  관리자 화면과 기능은 admin.js에 따로 있고, #admin으로 들어왔을 때(잠금 해제 후)만 불러옴.
  일반 방문자 화면에는 관리자 화면이 없음. */
const hooks={};let adminMod=null;
async function openAdmin(){
  try{
    adminMod||=(await import('./admin.js?v='+VERSION)).init(ctx());
    adminMod.enter();
  }catch(_){toast('관리자 화면을 불러오지 못했어요.');adminMod=null}
}
const ctx=()=>({S,LOCK,hooks,$,el,str,enc,dec,b64,unb64,rnd,newId,toast,render,applyFilter,openView,closeView,wireDialog,
  normalize,buttonsOf,catOf,isRepoFile,imgURL,sniff,keyFrom,encBytes,encJson,decJson,LOCK_ITER});

/* ================= 비밀번호 → 키 ================= */
async function keyFrom(code,salt,iter){
  const base=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
/* ================= 시작 ================= */
(async()=>{if(await loadSite()){document.body.classList.remove('locked');render();route()}else showLock()})();
}
</script>
