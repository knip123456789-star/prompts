<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>Prompts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23111'/%3E%3Crect x='4' y='4' width='8' height='8' rx='1' fill='none' stroke='%23fff' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#fff;--ink:#111;--mute:#737373;--line:#e6e6e6;--soft:#f4f4f4;--inv:#fff;
  --sans:"Pretendard Variable",Pretendard,system-ui,-apple-system,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0d;--ink:#f1f1f1;--mute:#8e8e8e;--line:#262626;--soft:#181818;--inv:#0d0d0d}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}

/* 헤더 */
.top{max-width:1320px;margin:0 auto;padding:56px max(4vw,16px) 28px;display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:clamp(26px,3.4vw,34px);font-weight:700;letter-spacing:-.025em;line-height:1.15}
.desc{margin:8px 0 0;color:var(--mute);font-size:15px;white-space:pre-line;max-width:60ch}
.abar{display:flex;gap:8px;flex-wrap:wrap}
/* 순서 바꾸기 모드 */
.grid.sorting .card{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.grid.sorting{margin-bottom:64px}
.grid.sorting .ph{outline:1px dashed var(--mute);outline-offset:3px}
.grid.sorting .card:hover .ph img{transform:none}
.grid .sortable-ghost{opacity:.25}
.sortable-fallback{opacity:.9!important;cursor:grabbing}
.sortbar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:15;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--inv);border-radius:999px;padding:6px 6px 6px 20px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:94vw;font-size:14px;white-space:nowrap}
.sortbar .btn{border-color:color-mix(in srgb,var(--inv) 35%,transparent);color:var(--inv)}
.sortbar .btn.fill{background:var(--inv);color:var(--ink);border-color:var(--inv)}
@media(max-width:420px){.sortbar .hint2{display:none}.sortbar{padding-left:6px}}

/* 버튼 */
.btn{height:40px;padding:0 16px;border:1px solid var(--ink);background:transparent;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap}
.btn.fill{background:var(--ink);color:var(--inv)}
.btn.line{border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.wide{width:100%;height:48px;font-size:15px}

/* 갤러리 */
main{max-width:1320px;margin:0 auto;padding:0 max(4vw,16px) 80px}
.cats{display:flex;gap:26px;border-block:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:28px}
.cats::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;flex:none;padding:15px 0 13px;font-size:15px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tab:focus-visible{outline:2px solid var(--ink)}
.tab small{margin-left:5px;font-size:12px;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:32px 18px}
.grid.ruled{border-top:1px solid var(--line);padding-top:28px}
.card{all:unset;cursor:pointer;display:block}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.ph{aspect-ratio:1/1;background:var(--soft);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block;opacity:0;transition:transform .5s ease,opacity .35s}
.ph img.ld{opacity:1}
.card:hover .ph img{transform:scale(1.035)}
.noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:12px;letter-spacing:.08em}
.nm{margin-top:10px;font-size:15px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:80px 0;text-align:center;color:var(--mute)}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}.top{padding-top:36px}}

/* 다이얼로그 공통 */
dialog{border:0;padding:0;background:var(--bg);color:var(--ink);max-width:none;max-height:none}
dialog::backdrop{background:rgba(0,0,0,.72)}
.x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;font-size:22px;line-height:1;z-index:2}

/* 보기 창 — 크기는 layoutView()가 사진 비율에 맞춰 정함 */
#view{width:min(920px,94vw);height:min(620px,90vh)}
.vw{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);height:100%}
.vimg{background:var(--soft);display:grid;place-items:center;overflow:hidden;touch-action:pan-y}
.vimg img{width:100%;height:100%;object-fit:contain}
.vb{padding:40px 32px 32px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.vcat{margin:0;font-size:13px;color:var(--mute)}
.vb h2{margin:0;padding-right:44px;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.vb h2:focus{outline:none}
.vdesc{margin:0;color:var(--mute);font-size:14.5px;line-height:1.7;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
.vdesc a{color:inherit;text-underline-offset:3px}
.copies{display:grid;margin-top:auto;padding-top:24px}
.crow{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:0 4px;border-top:1px solid var(--line);cursor:pointer;font-size:15px;font-weight:500}
.crow:last-child{border-bottom:1px solid var(--line)}
.crow:hover{background:var(--soft)}
.crow:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.ck{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);flex:none;font-weight:500}
.ck svg{width:15px;height:15px}
.crow:hover .ck,.crow.done .ck{color:var(--ink)}
.crow.done .ck{font-weight:600}
.vadm{display:flex;gap:8px;padding-top:18px}
#view.land{width:min(880px,94vw);height:fit-content;max-height:92vh}
#view.land .vw{grid-template-columns:1fr;height:auto;max-height:92vh;overflow:auto}
#view.land .vimg{aspect-ratio:var(--r)}
#view.land .vb{overflow:visible}
#view.land .copies{margin-top:0}
@media(max-width:760px){
  #view{width:100vw;height:100dvh}
  .vw{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}
  .vimg{height:auto;aspect-ratio:var(--r,1);max-height:64vh}
  .vb{overflow:visible;padding:24px 18px 32px}
  .copies{margin-top:6px}
}

/* 편집·설정 창 */
.panel{width:min(560px,94vw);max-height:92vh;overflow:auto;position:relative}
.panel form,.panel .pbody{padding:30px 26px;display:grid;gap:16px}
.panel h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.panel h3{margin:8px 0 0;font-size:15px;font-weight:700}
label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--mute)}
.sub{font-weight:400}
input[type=text],input[type=password],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);padding:11px 12px;font-size:16px;border-radius:0}
input:focus,textarea:focus,select:focus{border-color:var(--ink);outline:none}
textarea{resize:vertical;min-height:90px;font:14.5px/1.6 var(--mono)}
textarea.plain{font:15px/1.55 var(--sans)}
.drop{border:1px dashed var(--mute);aspect-ratio:3/2;display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden;background:var(--soft);color:var(--mute);font-size:14px;text-align:center;padding:12px;line-height:1.6}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--soft)}
.drop .chg{position:absolute;right:8px;bottom:8px;z-index:1;background:var(--bg);color:var(--ink);font-size:12px;padding:4px 10px;border-radius:999px}
.drop.over{border-color:var(--ink);color:var(--ink)}
.bsec{display:grid;gap:10px}
.bsec>.t{font-size:13px;font-weight:600;color:var(--mute)}
.brow{border:1px solid var(--line);display:grid}
.brow .bh{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.brow .bh input{border:0;flex:1;font-weight:600;padding:10px 12px}
.brow .bh button{border:0;background:none;width:40px;height:40px;cursor:pointer;color:var(--mute);font-size:16px;flex:none}
.brow .bh button:hover:not(:disabled){color:var(--ink)}
.brow .bh button:disabled{opacity:.3;cursor:default}
.brow textarea{border:0;min-height:76px}
.adds{display:flex;flex-wrap:wrap;gap:6px}
.adds .btn{height:34px;font-size:13px;padding:0 12px}
.hint{margin:0;font-size:13px;color:var(--mute)}
.msg{margin:0;font-size:14px;min-height:1.2em}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* 사이트 잠금 화면 — 잠겨 있는 동안 본문은 아예 그리지 않음 */
body.locked>header,body.locked>main{display:none}
#lock{position:fixed;inset:0;background:var(--bg);z-index:25;display:grid;place-items:center;padding:20px}
.lbox{width:min(340px,100%);display:grid;gap:14px;text-align:center}
.lbox svg{width:28px;height:28px;justify-self:center;color:var(--ink)}
.lbox h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
.lbox input{text-align:center;font-size:20px;letter-spacing:.3em;padding:12px}
.lbox input::placeholder{letter-spacing:normal;font-size:15px}
.lbox .hint{line-height:1.6;white-space:pre-line}
.lbox .notice{margin:0;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px;white-space:pre-line;line-height:1.6}

/* 숨겨진 로그인 */
#gate{position:fixed;inset:0;background:var(--bg);z-index:20;display:grid;place-items:center;padding:20px}
.gbox{width:min(360px,100%);display:grid;gap:14px}
.gbox h2{margin:0 0 4px;font-size:20px;font-weight:700}
.gbox .back{justify-self:center;background:none;border:0;color:var(--mute);cursor:pointer;font-size:14px;margin-top:6px}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,150%);background:var(--ink);color:var(--inv);padding:11px 18px;border-radius:999px;font-size:14px;transition:transform .2s,opacity .2s;z-index:30;max-width:92vw;opacity:0;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="locked">

<header class="top">
  <div>
    <h1 id="siteTitle">Prompts</h1>
    <p class="desc" id="siteDesc" hidden></p>
  </div>
  <div class="abar" id="abar" hidden>
    <button class="btn fill" id="addBtn">+ 올리기</button>
    <button class="btn line" id="sortBtn">순서 바꾸기</button>
    <button class="btn line" id="setBtn">설정</button>
    <button class="btn line" id="outBtn">로그아웃</button>
  </div>
</header>

<main>
  <nav class="cats" id="cats" aria-label="카테고리" hidden></nav>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden></p>
</main>

<!-- 보기 창 -->
<dialog id="view" aria-labelledby="vName">
  <button class="x" data-close aria-label="닫기">×</button>
  <div class="vw">
    <div class="vimg" id="vImg"></div>
    <div class="vb">
      <p class="vcat" id="vCat"></p>
      <h2 id="vName" tabindex="-1" autofocus></h2>
      <div class="vdesc" id="vDesc"></div>
      <div class="copies" id="vCopies"></div>
      <div class="vadm" id="vAdm" hidden>
        <button class="btn line" id="vEdit">수정</button>
        <button class="btn line" id="vTop">맨 앞으로</button>
        <button class="btn line" id="vDel">삭제</button>
      </div>
    </div>
  </div>
</dialog>

<!-- 올리기 / 수정 -->
<dialog id="ed" class="panel" aria-labelledby="edH">
  <button class="x" data-close aria-label="닫기">×</button>
  <form id="edf" novalidate>
    <h2 id="edH">올리기</h2>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="썸네일 이미지 선택">썸네일 이미지를 끌어다 놓거나, 눌러서 선택하거나, Ctrl+V로 붙여넣기<br>NAI에서 받은 PNG면 복사 버튼이 자동으로 채워져요<input type="file" id="file" accept="image/*" hidden></div>
    <label>이름<input type="text" id="fName" maxlength="80"></label>
    <label>카테고리<select id="fCat"></select></label>
    <label>설명 <span class="sub">· 복사 창에 보이는 글이에요. 비워 두면 안 보여요</span><textarea id="fDesc" class="plain" rows="4" maxlength="2000" placeholder="사용 팁, 추천 설정, 주의할 점 등"></textarea></label>
    <div class="bsec">
      <div class="t">복사 버튼 <span class="sub">· 위에서부터 창에 보이는 순서</span></div>
      <div id="fBtns" class="bsec"></div>
      <div class="adds">
        <button type="button" class="btn line" data-kind="prompt">+ 프롬프트</button>
        <button type="button" class="btn line" data-kind="char">+ 캐릭터</button>
        <button type="button" class="btn line" data-kind="neg">+ 네거티브</button>
        <button type="button" class="btn line" data-kind="custom">+ 직접 입력</button>
      </div>
    </div>
    <p class="msg" id="edMsg" role="status"></p>
    <button type="submit" class="btn fill wide" id="edSave">저장</button>
  </form>
</dialog>

<!-- 설정 -->
<dialog id="set" class="panel" aria-labelledby="setH">
  <button class="x" data-close aria-label="닫기">×</button>
  <div class="pbody">
    <h2 id="setH">설정</h2>
    <label>사이트 이름<input type="text" id="sTitle" maxlength="60"></label>
    <label>소개 문구<textarea id="sDesc" class="plain" rows="2" maxlength="300"></textarea></label>
    <label>카테고리 순서 <span class="sub">· 한 줄에 하나씩, 위에서부터 탭에 보이는 순서예요</span><textarea id="sCats" class="plain" rows="5"></textarea></label>
    <div class="row"><button class="btn fill" id="sSave">저장</button></div>
    <hr>
    <div id="lockSet" class="bsec" style="gap:16px" hidden>
      <h3>사이트 비밀번호</h3>
      <label>새 비밀번호 <span class="sub">· 바꾸지 않으려면 비워 두세요</span><input type="password" id="pNew" autocomplete="new-password"></label>
      <label>새 비밀번호 확인<input type="password" id="pNew2" autocomplete="new-password"></label>
      <label>힌트 <span class="sub">· 잠금 화면에 보여요</span><input type="text" id="pHint" maxlength="100"></label>
      <label>안내 문구 <span class="sub">· 잠금 화면 아래에 작게 보여요</span><textarea id="pNotice" class="plain" rows="2" maxlength="300"></textarea></label>
      <div class="row"><button class="btn line" id="pSave">잠금 설정 저장</button></div>
      <hr>
    </div>
    <h3>관리자 코드 바꾸기</h3>
    <label>새 코드<input type="password" id="cNew" autocomplete="new-password"></label>
    <label>새 코드 확인<input type="password" id="cNew2" autocomplete="new-password"></label>
    <div class="row"><button class="btn line" id="cSave">코드 바꾸기</button></div>
    <p class="msg" id="sMsg" role="status"></p>
  </div>
</dialog>

<!-- 사이트 잠금 -->
<section id="lock" hidden>
  <form class="lbox" id="lockForm" novalidate>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
    <h2>비밀번호를 입력해 주세요</h2>
    <input type="password" id="lockPw" autocomplete="current-password" aria-label="비밀번호" placeholder="비밀번호">
    <button class="btn fill wide" id="lockBtn">열기</button>
    <p class="msg" id="lockMsg" role="status"></p>
    <p class="hint" id="lockHint" hidden></p>
    <p class="notice" id="lockNotice" hidden></p>
  </form>
</section>

<!-- 숨겨진 로그인 (#admin) -->
<section id="gate" hidden>
  <form class="gbox" id="login" novalidate>
    <h2>관리자</h2>
    <input type="password" id="code" placeholder="코드" autocomplete="current-password" aria-label="관리자 코드">
    <button class="btn fill wide" id="loginBtn">들어가기</button>
    <p class="msg" id="gMsg" role="status"></p>
    <button type="button" class="back" data-leave>사이트로 돌아가기</button>
  </form>
  <form class="gbox" id="setup" novalidate hidden>
    <h2>처음 설정</h2>
    <p class="hint">한 번만 하면 돼요. GitHub 토큰은 아래 코드로 암호화해서 저장소에 올라가요.</p>
    <label>GitHub 사용자명<input type="text" id="uOwner" autocapitalize="off" spellcheck="false"></label>
    <label>저장소 이름<input type="text" id="uRepo" autocapitalize="off" spellcheck="false"></label>
    <label>브랜치<input type="text" id="uBranch" value="main" autocapitalize="off" spellcheck="false"></label>
    <label>GitHub 토큰<input type="password" id="uToken" autocomplete="off"></label>
    <label>관리자 코드 <span class="sub">· 12자 이상 권장</span><input type="password" id="uCode" autocomplete="new-password"></label>
    <label>코드 확인<input type="password" id="uCode2" autocomplete="new-password"></label>
    <button class="btn fill wide" id="setupBtn">설정 완료</button>
    <p class="msg" id="uMsg" role="status"></p>
    <button type="button" class="back" data-leave>사이트로 돌아가기</button>
  </form>
</section>

<div class="sortbar" id="sortbar" hidden>
  <span class="hint2">끌어서 순서를 바꾸세요</span>
  <button class="btn" id="sortCancel">취소</button>
  <button class="btn fill" id="sortSave">순서 저장</button>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
{
/* ================= 기본 도구 ================= */
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const str=v=>typeof v==='string'?v:'';
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=32768)s+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ITER=310000,MOBILE=760,DEFAULT_TITLE='Prompts';

const S={
  site:{title:'',description:'',categories:[],items:[]},
  cat:'',            // 선택한 탭
  loadError:false,
  admin:null,        // {token,owner,repo,branch} — 메모리에만 보관
  meta:null,         // admin.json
  local:{},          // 방금 올린 이미지 미리보기 (경로 → blob URL)
  viewing:null,vr:1, // 보기 창 항목, 사진 비율
  editing:null,file:null,dirty:false,
  work:null          // 순서 바꾸기 중인 목록 (저장 전)
};

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}

/* 데이터에서 온 이미지 경로는 저장소 안 폴더나 https만 허용 */
const safeSrc=p=>{p=str(p);return /^(images|thumbs)\/[\w.-]+$/.test(p)||/^https:\/\//.test(p)?p:''};
const isRepoFile=p=>/^(images|thumbs)\/[\w.-]+$/.test(str(p));

const SVG={copy:'<rect x="5.5" y="5.5" width="8" height="8" rx="1"/><path d="M10.5 3.5v-.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h.5"/>',check:'<path d="M3 8.5l3.2 3L13 4.5"/>'};
function icon(name){
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  for(const[k,v]of Object.entries({viewBox:'0 0 16 16',fill:'none',stroke:'currentColor','stroke-width':'1.4','stroke-linecap':'round','stroke-linejoin':'round','aria-hidden':'true'}))s.setAttribute(k,v);
  s.innerHTML=SVG[name];return s;
}
function linkify(box,text){
  box.replaceChildren();
  for(const part of text.split(/(https:\/\/[^\s<>"']+)/)){
    if(/^https:\/\//.test(part)){const a=el('a',null,part);a.href=part;a.target='_blank';a.rel='noopener noreferrer';box.append(a)}
    else if(part)box.append(document.createTextNode(part));
  }
}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);return true}catch(_){}
  const ta=el('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;opacity:0';
  document.body.append(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok;
}

/* ================= 사이트 잠금 =================
  lock.json        : 비밀번호로 감싼 내용 키 (+ 힌트·안내 문구)
  prompts.enc.json : 내용 키로 암호화한 목록
  images/*.bin     : 내용 키로 암호화한 이미지 ([iv 12바이트][암호문])
  비밀번호 없이는 목록·이미지를 풀 수 없음. 해제한 키는 이 탭에서만 기억(sessionStorage). */
const LOCK={on:false,meta:null,key:null,raw:null};
const LOCK_ITER=600000,SKEY='prompts-unlock';
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const importKey=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function encBytes(u8){const iv=rnd(12),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},LOCK.key,u8));const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return o}
async function decBytes(u8){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8.subarray(0,12)},LOCK.key,u8.subarray(12)))}
async function encJson(obj){const iv=rnd(12),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},LOCK.key,enc.encode(JSON.stringify(obj))));return JSON.stringify({v:1,iv:b64(iv),data:b64(ct)})+'\n'}
async function decJson(text){const o=JSON.parse(text);return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},LOCK.key,unb64(o.data))))}
async function wrapKey(pw,raw){const salt=rnd(16),iv=rnd(12),kek=await keyFrom(pw,salt,LOCK_ITER);return{salt:b64(salt),iter:LOCK_ITER,iv:b64(iv),data:b64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},kek,raw)))}}
async function unlockWith(pw){
  const w=LOCK.meta.wrap,kek=await keyFrom(pw,unb64(w.salt),Number(w.iter)||LOCK_ITER);
  const raw=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(w.iv)},kek,unb64(w.data)));
  await setKey(raw);
}
async function setKey(raw){LOCK.raw=raw;LOCK.key=await importKey(raw);try{sessionStorage.setItem(SKEY,b64(raw))}catch(_){}}
function forgetKey(){LOCK.key=LOCK.raw=null;try{sessionStorage.removeItem(SKEY)}catch(_){}}
const sniff=u=>u[0]===0xFF&&u[1]===0xD8?'image/jpeg':u[0]===0x89&&u[1]===0x50?'image/png':'image/webp';
/* 경로 → 화면에 쓸 주소. .bin이면 받아서 복호화한 blob 주소 */
const imgCache=new Map();
function imgURL(p){
  p=str(p);
  if(S.local[p])return Promise.resolve(S.local[p]);
  if(/\.bin$/.test(p)&&isRepoFile(p)){
    if(!LOCK.key)return Promise.reject();
    if(!imgCache.has(p))imgCache.set(p,(async()=>{
      const r=await fetch(p);if(!r.ok)throw 0;
      const u=await decBytes(new Uint8Array(await r.arrayBuffer()));
      return URL.createObjectURL(new Blob([u],{type:sniff(u)}));
    })().catch(e=>{imgCache.delete(p);throw e}));
    return imgCache.get(p);
  }
  const u=safeSrc(p);return u?Promise.resolve(u):Promise.reject();
}
function showLock(){
  document.body.classList.add('locked');$('#lock').hidden=false;
  const m=LOCK.meta,h=str(m.hint).trim(),n=str(m.notice).trim();
  $('#lockHint').textContent=h?'힌트: '+h:'';$('#lockHint').hidden=!h;
  $('#lockNotice').textContent=n;$('#lockNotice').hidden=!n;
  $('#lockMsg').textContent='';$('#lockPw').value='';$('#lockPw').focus();
}
$('#lockForm').addEventListener('submit',async e=>{
  e.preventDefault();const pw=$('#lockPw').value,b=$('#lockBtn'),m=$('#lockMsg');
  if(!pw)return;b.disabled=true;m.textContent='여는 중…';
  try{await unlockWith(pw)}catch(_){m.textContent='비밀번호가 맞지 않아요.';$('#lockPw').select();b.disabled=false;return}
  try{await loadLocked()}catch(_){forgetKey();m.textContent='목록을 열지 못했어요. 잠시 뒤 다시 시도해 주세요.';b.disabled=false;return}
  b.disabled=false;$('#lock').hidden=true;document.body.classList.remove('locked');render();route();
});
async function loadLocked(){
  const r=await fetch('prompts.enc.json?v='+Date.now(),{cache:'no-store'});
  if(r.status===404){   // 아직 암호화 전(관리자가 처음 들어오면 자동 변환)
    const o=await fetch('prompts.json?v='+Date.now(),{cache:'no-store'}).catch(()=>null);
    S.site=normalize(o?.ok?await o.json():null);S.loadError=false;return;
  }
  if(!r.ok)throw 0;
  S.site=normalize(await decJson(await r.text()));S.loadError=false;
}

/* ================= 데이터 ================= */
function normalize(d){
  d=d&&typeof d==='object'?d:{};
  const seen=new Set();
  const items=(Array.isArray(d.items)?d.items:[]).filter(x=>x&&typeof x==='object'&&typeof x.id==='string'&&!seen.has(x.id)&&seen.add(x.id));
  const categories=[...new Set((Array.isArray(d.categories)?d.categories:[]).filter(c=>typeof c==='string').map(c=>c.trim()).filter(Boolean))];
  return{title:str(d.title),description:str(d.description),categories,items};
}
/* 열 수 있으면 true, 비밀번호가 필요하면 false */
async function loadSite(){
  try{const r=await fetch('lock.json?v='+Date.now(),{cache:'no-store'});LOCK.meta=r.ok?await r.json():null}catch(_){LOCK.meta=null}
  LOCK.on=!!LOCK.meta?.wrap;
  if(LOCK.on){
    let saved=null;try{saved=sessionStorage.getItem(SKEY)}catch(_){}
    if(!saved)return false;
    try{await setKey(unb64(saved));await loadLocked();return true}catch(_){forgetKey();return false}
  }
  try{const r=await fetch('prompts.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;S.site=normalize(await r.json());S.loadError=false}
  catch(_){S.site=normalize(null);S.loadError=true}
  return true;
}
const catOf=it=>str(it.category).trim()||'기타';
function catList(){
  const s=S.site,used=[...new Set(s.items.map(it=>str(it.category).trim()).filter(Boolean))];
  const out=s.categories.concat(used.filter(c=>!s.categories.includes(c)));
  if(out.length&&s.items.some(it=>!str(it.category).trim())&&!out.includes('기타'))out.push('기타');
  return out;
}
/* 예전 형식(prompt/chars/uc)도 버튼 목록으로 */
function buttonsOf(it){
  if(Array.isArray(it.buttons))return it.buttons.filter(b=>b&&typeof b.text==='string'&&b.text.trim()).map(b=>({label:str(b.label).trim()||'내용',text:b.text,kind:str(b.kind)||'custom'}));
  const out=[],ch=(Array.isArray(it.chars)?it.chars:[]).filter(c=>typeof c==='string'&&c.trim());
  if(str(it.prompt).trim())out.push({label:'프롬프트',text:it.prompt,kind:'prompt'});
  ch.forEach((c,i)=>out.push({label:ch.length>1?`캐릭터 ${i+1}`:'캐릭터',text:c,kind:'char'}));
  if(str(it.uc).trim())out.push({label:'네거티브',text:it.uc,kind:'neg'});
  return out;
}
const visibleItems=()=>S.site.items.filter(it=>!S.cat||catOf(it)===S.cat);

/* ================= 갤러리 ================= */
/* 썸네일은 화면 근처에 왔을 때 불러옴 (잠금 사이트면 그때 복호화) */
const io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){io.unobserve(e.target);fillThumb(e.target)}},{rootMargin:'600px 0px'});
function fillThumb(ph){
  const noimg=()=>ph.replaceChildren(el('span','noimg','NO IMAGE'));
  imgURL(ph.dataset.src).then(u=>{
    const im=el('img');im.alt='';im.decoding='async';im.draggable=false;
    im.onload=()=>im.classList.add('ld');im.onerror=noimg;im.src=u;ph.replaceChildren(im);
  },noimg);
}
function card(it){
  const b=el('button','card');b.type='button';b.dataset.id=it.id;
  const ph=el('div','ph'),src=str(it.thumb)||str(it.image);
  if(src){ph.dataset.src=src;io.observe(ph)}else ph.append(el('span','noimg','NO IMAGE'));
  b.append(ph,el('div','nm',str(it.name)||'이름 없음'));
  return b;
}
/* 데이터가 바뀔 때만 카드를 다시 만들고, 탭 전환은 표시만 바꿈 */
function render(){
  const s=S.site,t=s.title||DEFAULT_TITLE;
  $('#siteTitle').textContent=t;document.title=t;
  $('#siteDesc').textContent=s.description;$('#siteDesc').hidden=!s.description;
  $('#abar').hidden=!S.admin||!!S.work;$('#sortbar').hidden=!S.work;
  if(S.viewing)S.viewing=s.items.find(x=>x.id===S.viewing.id)||S.viewing;   // 저장 후 최신 항목으로
  $('#grid').replaceChildren(...(S.work||s.items).map(card));
  $('#grid').classList.toggle('sorting',!!S.work);
  renderTabs();
}
function renderTabs(){
  const cats=catList(),nav=$('#cats');
  if(S.cat&&!cats.includes(S.cat))S.cat='';
  nav.hidden=!cats.length;$('#grid').classList.toggle('ruled',!cats.length);
  const count=c=>S.site.items.filter(it=>catOf(it)===c).length;
  nav.replaceChildren(...(cats.length?[['전체','',S.site.items.length],...cats.map(c=>[c,c,count(c)])]:[]).map(([label,val,n])=>{
    const b=el('button','tab',label);b.type='button';b.dataset.cat=val;b.setAttribute('aria-pressed',S.cat===val);b.append(el('small',null,String(n)));return b;
  }));
  applyFilter();
}
function applyFilter(){
  let shown=0;const byId=new Map(S.site.items.map(x=>[x.id,x]));
  for(const c of $('#grid').children){const it=byId.get(c.dataset.id);const on=!!it&&(!S.cat||catOf(it)===S.cat);c.hidden=!on;if(on)shown++}
  for(const b of $('#cats').children)b.setAttribute('aria-pressed',b.dataset.cat===S.cat);
  const e=$('#empty');e.hidden=shown>0;
  e.textContent=S.loadError?'프롬프트 목록을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.'
    :S.site.items.length?'이 카테고리에는 아직 프롬프트가 없어요.'
    :S.admin?'아직 올린 프롬프트가 없어요. “+ 올리기”로 시작해 보세요.':'아직 올라온 프롬프트가 없어요.';
}
$('#cats').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){S.cat=b.dataset.cat;applyFilter()}});
$('#grid').addEventListener('click',e=>{if(S.work)return;const c=e.target.closest('.card');if(c)location.hash='p-'+c.dataset.id});

/* ================= 순서 바꾸기 (관리자) ================= */
/* 드래그 라이브러리는 관리자가 처음 누를 때만 불러옴 — 방문자는 안 받음 */
let sortLib=null,sorter=null;
function loadSortable(){
  return sortLib||=new Promise((ok,fail)=>{
    const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js';
    sc.onload=()=>ok(window.Sortable);sc.onerror=()=>{sortLib=null;fail()};document.head.append(sc);
  });
}
/* 탭으로 일부만 보일 때: 보이는 카드끼리만 자리를 바꾸고, 안 보이는 카드는 제자리 */
function syncWork(){
  const g=$('#grid'),nodes=new Map([...g.children].filter(c=>c.dataset.id).map(c=>[c.dataset.id,c]));
  const vis=[...nodes.values()].filter(c=>!c.hidden).map(c=>c.dataset.id);
  const byId=new Map(S.work.map(x=>[x.id,x])),shown=it=>!S.cat||catOf(it)===S.cat;
  const next=S.work.slice();let k=0;
  S.work.forEach((it,i)=>{if(shown(it))next[i]=byId.get(vis[k++])});
  S.work=next;g.append(...S.work.map(it=>nodes.get(it.id)));
}
$('#sortBtn').onclick=async e=>{
  const b=e.currentTarget;b.disabled=true;let Sortable;
  try{Sortable=await loadSortable()}catch(_){toast('드래그 기능을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');b.disabled=false;return}
  b.disabled=false;S.work=S.site.items.slice();render();
  sorter=Sortable.create($('#grid'),{animation:180,draggable:'.card:not([hidden])',forceFallback:true,fallbackOnBody:true,fallbackTolerance:4,
    delay:160,delayOnTouchOnly:true,ghostClass:'sortable-ghost',onEnd:syncWork});
};
function endSort(){sorter?.destroy();sorter=null;S.work=null;render()}
$('#sortCancel').onclick=endSort;
$('#sortSave').onclick=async e=>{
  const b=e.currentTarget,order=new Map(S.work.map((it,i)=>[it.id,i]));
  const same=S.work.every((it,i)=>S.site.items[i]?.id===it.id);
  if(same){endSort();return}
  b.disabled=true;b.textContent='저장 중…';
  try{
    await commit({message:'Reorder',mutate:d=>{d.items.sort((x,y)=>(order.get(x.id)??1e9)-(order.get(y.id)??1e9));return d}});
    endSort();toast('순서를 저장했어요 · 사이트 반영까지 1~2분');
  }catch(err){toast(ghErr(err))}
  b.disabled=false;b.textContent='순서 저장';
};

/* ================= 보기 창 ================= */
/* 세로·정사각형은 사진 왼쪽, 가로는 사진 위 — 창 크기를 사진 비율에 맞춤 */
function layoutView(){
  const v=$('#view'),vw=v.querySelector('.vw'),r=S.vr||1,mobile=innerWidth<=MOBILE,land=!mobile&&r>1.15;
  v.style.setProperty('--r',r);v.classList.toggle('land',land);
  v.style.width=v.style.height='';vw.style.gridTemplateColumns='';
  if(mobile)return;
  const maxW=Math.min(innerWidth*.94,1120),maxH=Math.min(innerHeight*.9,680);
  if(land){v.style.width=Math.round(Math.min(maxW,Math.max(560,innerHeight*.5*r)))+'px';return}
  const body=400;let H=maxH,col=H*r;
  if(col+body>maxW){col=maxW-body;H=Math.max(360,col/r)}
  v.style.width=Math.round(col+body)+'px';v.style.height=Math.round(H)+'px';
  vw.style.gridTemplateColumns=Math.round(col)+'px minmax(0,1fr)';
}
let resizeT;addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{if($('#view').open)layoutView()},80)});

function copyRow(label,text){
  const b=el('button','crow');b.type='button';
  const ck=el('span','ck');ck.append(icon('copy'),'복사');
  b.append(el('span',null,label),ck);
  b.onclick=async()=>{
    if(!await copyText(text)){toast('복사하지 못했어요. 브라우저 권한을 확인해 주세요.');return}
    ck.replaceChildren(icon('check'),'복사됨');b.classList.add('done');
    clearTimeout(b._t);b._t=setTimeout(()=>{ck.replaceChildren(icon('copy'),'복사');b.classList.remove('done')},1400);
  };
  return b;
}
function openView(id){
  const it=S.site.items.find(x=>x.id===id);if(!it){closeView();return}
  S.viewing=it;S.vr=Number(it.ratio)>0?Number(it.ratio):1;
  const vi=$('#vImg'),src=str(it.image)||str(it.thumb);vi.replaceChildren();
  if(src)imgURL(src).then(u=>{
    if(S.viewing?.id!==it.id)return;
    const im=el('img');im.alt=str(it.name);
    im.onload=()=>{if(S.viewing?.id===it.id&&im.naturalHeight){S.vr=im.naturalWidth/im.naturalHeight;layoutView()}};
    im.src=u;vi.replaceChildren(im);
  },()=>{if(S.viewing?.id===it.id)vi.replaceChildren(el('span','noimg','NO IMAGE'))});
  else vi.replaceChildren(el('span','noimg','NO IMAGE'));

}
function closeView(){const v=$('#view');if(v.open)v.close()}
/* ←/→ 키와 사진 스와이프로 이전·다음 */
function step(d){
  const list=visibleItems(),i=list.findIndex(x=>x.id===S.viewing?.id);
  if(i<0||list.length<2)return;
  location.replace('#p-'+list[(i+d+list.length)%list.length].id);
}
document.addEventListener('keydown',e=>{if(!$('#view').open||e.target.matches?.('input,textarea,select'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
{let x0=null;const vi=$('#vImg');
  vi.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  vi.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)step(dx<0?1:-1)});}
$('#view').addEventListener('close',()=>{S.viewing=null;if(location.hash.startsWith('#p-'))history.replaceState(null,'',location.pathname+location.search)});

/* 다이얼로그: 바깥(배경)에서 눌렀다 뗐을 때만 닫기 — 글자 드래그하다 닫히는 것 방지 */

/* 올리기 창은 고친 내용이 있으면 확인 후 닫기 */

$('#ed').addEventListener('input',()=>{S.dirty=true});

/* ================= 라우팅 ================= */
function route(){
  if(LOCK.on&&!LOCK.key)return;   // 잠금 해제 전에는 아무것도 열지 않음
  const h=location.hash;
  if(h==='#admin'){if(S.admin)history.replaceState(null,'',location.pathname);else showGate();return}

/* ================= 암호화 (토큰 ↔ 관리자 코드) ================= */
async function keyFrom(code,salt,iter){
  const base=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(token,code){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await keyFrom(code,salt,ITER),enc.encode(token)));
  return{salt:b64(salt),iv:b64(iv),data:b64(ct),iter:ITER};
}
async function unseal(m,code){
  const k=await keyFrom(code,unb64(m.salt),Number(m.iter)||ITER);
  return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(m.iv)},k,unb64(m.data)));
}

/* ================= GitHub (한 번의 작업 = 커밋 1개) ================= */
async function api(path,{method='GET',body,raw=false}={}){
  const a=S.admin;
  const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(a.owner)}/${encodeURIComponent(a.repo)}/${path}`,{
    method,cache:'no-store',
    headers:{Authorization:'Bearer '+a.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json'},
    body:body?JSON.stringify(body):undefined});
  if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e}
  return raw==='bin'?r.arrayBuffer():raw?r.text():r.status===204?null:r.json();
}
const refPath=()=>'git/ref/heads/'+S.admin.branch.split('/').map(encodeURIComponent).join('/');
const headSha=async()=>(await api(refPath())).object.sha;
async function readAt(path,ref){try{return await api(`contents/${path}?ref=${encodeURIComponent(ref)}`,{raw:true})}catch(e){if(e.status===404)return null;throw e}}
async function exists(path,ref){try{await api(`contents/${path}?ref=${encodeURIComponent(ref)}`);return true}catch(e){if(e.status===404)return false;throw e}}
async function readSite(ref){
  if(LOCK.on){const t=await readAt('prompts.enc.json',ref);if(t!=null)return normalize(await decJson(t))}
  const t=await readAt('prompts.json',ref);   // 잠금 전 형식
  return normalize(t!=null?JSON.parse(t):structuredClone(S.site));
}
/*
  files:  {경로: Blob|문자열}  올릴 파일
  remove: [경로]              지울 파일 (없으면 건너뜀)
  mutate: prompts.json 고치는 함수 (최신 내용을 받아서 고친 걸 돌려줌)
  → 모두 커밋 하나로. 다른 곳에서 먼저 커밋했으면 최신 내용으로 다시 시도.
*/
async function commit({files={},remove=[],mutate,message}){
  const blobs=[];
  for(const[path,v]of Object.entries(files)){
    const content=v instanceof Blob?b64(new Uint8Array(await v.arrayBuffer())):b64(enc.encode(v));
    const {sha}=await api('git/blobs',{method:'POST',body:{content,encoding:'base64'}});
    blobs.push({path,mode:'100644',type:'blob',sha});
  }
  for(let attempt=0;;attempt++){
    const head=await headSha(),base=(await api('git/commits/'+head)).tree.sha;
    const tree=blobs.slice();let next=null;
    const rm=mutate&&LOCK.on?[...remove,'prompts.json']:remove;   // 잠금 사이트엔 평문 목록을 남기지 않음
    for(const p of rm)if(await exists(p,head))tree.push({path:p,mode:'100644',type:'blob',sha:null});
    if(mutate){
      next=mutate(await readSite(head));
      tree.push(LOCK.on?{path:'prompts.enc.json',mode:'100644',type:'blob',content:await encJson(next)}
                       :{path:'prompts.json',mode:'100644',type:'blob',content:JSON.stringify(next,null,2)+'\n'});
    }
    if(!tree.length)return;
    const t=await api('git/trees',{method:'POST',body:{base_tree:base,tree}});
    const c=await api('git/commits',{method:'POST',body:{message,tree:t.sha,parents:[head]}});
    try{await api(refPath().replace('git/ref/','git/refs/'),{method:'PATCH',body:{sha:c.sha}})}
    catch(e){if(e.status===422&&attempt<3)continue;throw e}
    if(next){S.site=next;render()}
    return;
  }
}
const ghErr=e=>!e||!e.status?'저장하지 못했어요. 인터넷 연결을 확인해 주세요.'
  :e.status===401?'토큰이 만료됐거나 잘못됐어요. README의 “토큰이 만료됐을 때”를 따라 해 주세요.'
  :e.status===403?'토큰에 이 저장소 쓰기 권한이 없어요.'
  :e.status===404?'저장소나 브랜치를 찾을 수 없어요. 이름과 권한을 확인해 주세요.'
  :e.status===409?'저장소가 비어 있어요. 파일을 먼저 올려 주세요.'
  :'GitHub에 저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.';

/* 잠금 전에 올린 평문 목록·이미지가 있으면 암호화해서 바꿔치기 (커밋 1개) */
async function migrate(){
  const head=await headSha(),site=await readSite(head),plainList=await exists('prompts.json',head);
  const paths=[...new Set(site.items.flatMap(it=>[it.image,it.thumb]).filter(p=>isRepoFile(p)&&!/\.bin$/.test(p)))];
  if(!plainList&&!paths.length)return;
  toast('기존 데이터를 암호화하는 중…');
  const files={},remove=[],map={};
  for(const p of paths){
    try{
      const u=new Uint8Array(await api(`contents/${p}?ref=${head}`,{raw:'bin'}));
      const np=p.replace(/\.[^./]+$/,'')+'.bin';files[np]=new Blob([await encBytes(u)]);remove.push(p);map[p]=np;
      S.local[np]=URL.createObjectURL(new Blob([u],{type:sniff(u)}));
    }catch(e){if(e.status!==404)throw e;map[p]=''}
  }
  await commit({files,remove,message:'Encrypt existing data',mutate:d=>{for(const it of d.items)for(const f of['image','thumb'])if(map[it[f]]!==undefined)it[f]=map[it[f]];return d}});
  toast('기존 데이터를 암호화했어요');
}

/* ================= 이미지 ================= */
/* 한 번만 디코딩해서 원본(긴 변 1216px)과 정사각형 썸네일(480px)을 만듦 */
async function prepareImage(file){
  const bmp=await createImageBitmap(file);
  const out=(w,h,draw,q)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));return toBlob(c,q)};
  try{
    const s=Math.min(1,1216/Math.max(bmp.width,bmp.height)),fw=Math.round(bmp.width*s),fh=Math.round(bmp.height*s);
    const side=Math.min(bmp.width,bmp.height),sx=(bmp.width-side)/2,sy=(bmp.height-side)*.25,o=Math.min(480,side);
    const [full,thumb]=await Promise.all([
      out(fw,fh,g=>g.drawImage(bmp,0,0,fw,fh),.88),
      out(o,o,g=>g.drawImage(bmp,sx,sy,side,side,0,0,o,o),.82)]);
    return{full,thumb,ratio:+(bmp.width/bmp.height).toFixed(4)};
  }finally{bmp.close?.()}
}
async function toBlob(c,q){
  let b=await new Promise(r=>c.toBlob(r,'image/webp',q));
  if(!b||b.type!=='image/webp')b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
  return b;
}
/* NAI PNG 메타데이터(tEXt/iTXt) 읽기 */
async function naiMeta(file){
  try{
    if(file.type&&file.type!=='image/png')return null;
    const u=new Uint8Array(await file.arrayBuffer());if(u[0]!==137||u[1]!==80||u[2]!==78)return null;
    const dv=new DataView(u.buffer);let p=8;const out={};
    while(p+12<=u.length){
      const len=dv.getUint32(p),type=String.fromCharCode(...u.subarray(p+4,p+8)),d=u.subarray(p+8,p+8+len);
      if(type==='IDAT'||type==='IEND')break;   // 텍스트는 보통 이미지 데이터 앞에 있음
      if(type==='tEXt'||type==='iTXt'){
        const z=d.indexOf(0);
        if(z>0){let v=d.subarray(z+1);
          if(type==='iTXt'){if(v[0]===0){v=v.subarray(2);for(let n=0;n<2;n++)v=v.subarray(v.indexOf(0)+1)}else v=null}
          if(v)out[dec.decode(d.subarray(0,z))]=dec.decode(v);}
      }
      p+=12+len;
    }
    let c={};try{c=JSON.parse(out.Comment||'{}')}catch(_){}
    const chars=(c.v4_prompt?.caption?.char_captions||[]).map(x=>str(x?.char_caption)).filter(Boolean);
    const prompt=str(c.prompt)||str(out.Description),uc=str(c.uc);
    return prompt||uc||chars.length?{prompt,uc,chars}:null;
  }catch(_){return null}
}

const rows=()=>[...$('#fBtns').children];
const DEFAULT_LABEL={prompt:'프롬프트',neg:'네거티브',custom:''};
function refreshRows(){rows().forEach((r,i)=>{r.querySelector('[data-up]').disabled=i===0})}
function btnRow(kind,label,text=''){
  if(label==null)label=kind==='char'?`캐릭터 ${rows().filter(r=>r.dataset.kind==='char').length+1}`:DEFAULT_LABEL[kind]??'';
  const r=el('div','brow');r.dataset.kind=kind;
  const h=el('div','bh'),li=el('input');
  Object.assign(li,{type:'text',maxLength:30,value:label,placeholder:'버튼 이름 (예: 배경 태그)'});li.setAttribute('aria-label','버튼 이름');
  const up=el('button',null,'↑');Object.assign(up,{type:'button',title:'위로'});up.dataset.up='';
  up.onclick=()=>{r.previousElementSibling?.before(r);refreshRows();S.dirty=true};
  const x=el('button',null,'×');Object.assign(x,{type:'button',title:'빼기'});
  x.onclick=()=>{r.remove();refreshRows();S.dirty=true};
  h.append(li,up,x);
  const t=el('textarea');Object.assign(t,{rows:3,value:text,placeholder:'복사될 내용'});t.setAttribute('aria-label','버튼 내용');
  r.append(h,t);$('#fBtns').append(r);refreshRows();return r;
}

let previewURL=null;
function setPreview(src){
  const d=$('#drop');d.querySelectorAll('img,.chg').forEach(n=>n.remove());
  if(previewURL&&src!==previewURL){URL.revokeObjectURL(previewURL);previewURL=null}
  if(src){const im=el('img');im.alt='';im.src=src;d.append(im,el('span','chg','바꾸기'))}
}
function openEd(it){
  S.editing=it||null;S.file=null;
  $('#edH').textContent=it?'수정':'올리기';
  $('#fName').value=str(it?.name);
  const sel=$('#fCat'),cur=str(it?.category),opts=S.site.categories.slice();
  if(cur&&!opts.includes(cur))opts.push(cur);
  sel.replaceChildren(...opts.map(c=>{const o=el('option',null,c);o.value=c;return o}),Object.assign(el('option',null,'없음 (기타)'),{value:''}));
  sel.value=it?cur:(S.cat&&opts.includes(S.cat)?S.cat:opts[0]||'');
  $('#fDesc').value=str(it?.memo);
  $('#fBtns').replaceChildren();
  const bs=it?buttonsOf(it):[];bs.length?bs.forEach(b=>btnRow(b.kind,b.label,b.text)):btnRow('prompt');
  setPreview('');if(it&&(it.image||it.thumb))imgURL(str(it.image)||str(it.thumb)).then(u=>{if(S.editing===it&&!S.file)setPreview(u)},()=>{});
  $('#edMsg').textContent='';$('#file').value='';$('#edSave').disabled=false;
  S.dirty=false;closeView();$('#ed').showModal();
}
async function pick(f){
  if(!f||!f.type.startsWith('image/')){if(f)$('#edMsg').textContent='이미지 파일만 올릴 수 있어요.';return}
  S.file=f;S.dirty=true;previewURL=URL.createObjectURL(f);setPreview(previewURL);
  if(!$('#fName').value.trim()&&f.name&&!/^image\.\w+$/.test(f.name))$('#fName').value=f.name.replace(/\.[^.]+$/,'');
  const m=await naiMeta(f);
  if(!m){$('#edMsg').textContent='';return}
  const fill=(kind,text)=>{const r=rows().find(r=>r.dataset.kind===kind&&!r.querySelector('textarea').value.trim());(r||btnRow(kind)).querySelector('textarea').value=text};
  if(m.prompt)fill('prompt',m.prompt);
  m.chars.forEach(c=>fill('char',c));
  if(m.uc)fill('neg',m.uc);
  $('#edMsg').textContent='이미지에서 프롬프트를 불러왔어요.';
}

$('#pSave').onclick=async e=>{
  const pw=$('#pNew').value,m=$('#sMsg'),b=e.currentTarget;
  if(pw&&pw!==$('#pNew2').value){m.textContent='비밀번호 확인이 일치하지 않아요.';return}
  b.disabled=true;m.textContent='저장하는 중…';
  try{
    const meta={...LOCK.meta,hint:$('#pHint').value.trim(),notice:$('#pNotice').value.trim()};
    if(pw)meta.wrap=await wrapKey(pw,LOCK.raw);   // 내용 키는 그대로, 감싸는 비밀번호만 바뀜
    await commit({files:{'lock.json':JSON.stringify(meta,null,2)+'\n'},message:pw?'Change site password':'Update lock text'});
    LOCK.meta=meta;$('#pNew').value='';$('#pNew2').value='';
    m.textContent=pw?'비밀번호를 바꿨어요. 1~2분 뒤부터 새 비밀번호로 열려요.':'저장했어요.';
  }catch(err){m.textContent=ghErr(err)}
  b.disabled=false;
};
$('#cSave').onclick=async e=>{
  const c=$('#cNew').value,m=$('#sMsg'),b=e.currentTarget;
  if(c.length<8){m.textContent='코드는 8자 이상으로 정해 주세요.';return}
  if(c!==$('#cNew2').value){m.textContent='코드 확인이 일치하지 않아요.';return}
  b.disabled=true;m.textContent='바꾸는 중…';
  try{
    const json=adminJson(S.admin,await seal(S.admin.token,c));
    await commit({files:{'admin.json':json},message:'Change admin code'});
    S.meta=JSON.parse(json);m.textContent='코드를 바꿨어요. 다음 로그인부터 새 코드를 쓰세요.';
    $('#cNew').value='';$('#cNew2').value='';
  }catch(err){m.textContent=ghErr(err)}
  b.disabled=false;
};

/* ================= 시작 ================= */
(async()=>{if(await loadSite()){document.body.classList.remove('locked');render();route()}else showLock()})();
}
</script>
</body>
